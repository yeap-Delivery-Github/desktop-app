name: build-test

# Windows installer pointing to the test portal, published as a GitHub pre-release on the tag.
# Trigger: push a tag starting with "test-" (e.g. test-1.1.0-3).
on:
  push:
    tags: ["test-*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MAIN_VITE_PORTAL_URL: https://test-portal.yeapdelivery.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run build && npx electron-builder --win --publish never

      - name: Publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe
          --prerelease
          --title "$GITHUB_REF_NAME (portal de teste)"
          --notes "Instalador de teste apontando para https://test-portal.yeapdelivery.com.br. Não usar em produção."
